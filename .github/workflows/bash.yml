# The offline gate for the bash script, on the toolchain mise.toml pins and
# mise.lock checksums: bats over the recorded fixtures, the one terminal-bound
# test under a TERM readline accepts, the version line, and the rule that
# every fixture is tracked. No live recipe runs here: `just test`,
# `just test-openai` and `just test-agents` spend tokens and need keys.
name: Bash

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  bats:
    name: bats, offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          install_args: jq usage bats just

      # TERM is unset on a runner, which is the case the pty tag exists for:
      # unit-tests must report zero failures without it.
      - name: Unit tests
        run: just unit-tests

      - name: The terminal-bound test alone
        run: just pty-test

      - name: The script's copy of VERSION
        run: just check-version-line

      # Fixtures are gitignored by pattern with tracked exceptions. A rule that
      # starts matching a tracked fixture leaves it tracked here but ignored for
      # the next clone that re-adds it; a missing exception for a new fixture
      # directory already shows up as the harness test naming the file.
      - name: No tracked fixture matches an ignore rule
        run: |
          set -euo pipefail
          if git ls-files -z 'tests/fixtures/**.sse' | git check-ignore --no-index -z --stdin -q; then
            git ls-files -z 'tests/fixtures/**.sse' | git check-ignore --no-index -z --stdin -v | tr '\0' ' ' >&2
            echo "a tracked fixture matches an ignore rule; fix .gitignore" >&2
            exit 1
          fi
          test "$(git ls-files 'tests/fixtures/**.sse' | wc -l)" -gt 20
