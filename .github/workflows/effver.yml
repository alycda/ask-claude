# EffVer: VERSION and CHANGELOG.md agree in every commit of the range, and
# the effort floor from a usage diff of the #USAGE spec since the last
# version commit is written to the job summary, as `just effort-floor` prints
# it locally. The floor is advice to the person cutting the release, so it
# never fails the job; check-effver does.
name: EffVer

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  effver:
    name: check-effver and the effort floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v5
        with:
          install_args: usage

      - name: check-effver over the range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "no base to compare against (first push?); checking HEAD alone"
            tools/effver/check-effver HEAD~1..HEAD
          else
            tools/effver/check-effver "$BASE..HEAD"
          fi

      - name: the effort floor, from the spec since the last version commit
        run: |
          set -euo pipefail
          rel="$(git log -1 --format=%H HEAD -- VERSION)"
          [ "$rel" != "$(git rev-parse HEAD)" ] || rel="$(git log -1 --format=%H HEAD~1 -- VERSION)"
          mkdir -p /tmp/floor/old /tmp/floor/new
          git show "$rel:ask-claude" > /tmp/floor/old/ask-claude
          cp ask-claude /tmp/floor/new/ask-claude
          {
            echo "### Effort floor since $(git log -1 --format=%s "$rel")"
            echo
            echo '```'
            if usage diff /tmp/floor/old/ask-claude /tmp/floor/new/ask-claude; then
              echo "floor: micro (no breaking interface change)"
            else
              echo "floor: meso (breaking interface change; macro if it hits most users)"
            fi
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
