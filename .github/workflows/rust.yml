# Checks on the Rust port (rust/, docs/plan.md phase 4), run only when its
# files or the spec it must match change. Two steps must pass from the first
# scaffold: the crate builds, and `just check-spec` finds the tracked spec
# snapshot is what the binary prints. fmt, clippy and the tests are allowed to fail
# until the port clears its gates: the golden tests are red on todo!() by
# design until each step lands, and a spike may be unformatted. Turn
# continue-on-error off when the parity gate's verified commit says so.
name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'ask-claude'
      - 'ask-claude.usage.kdl'
      - 'tests/fixtures/**'
      - 'mise.toml'
      - 'mise.lock'
      - 'justfile'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'ask-claude'
      - 'ask-claude.usage.kdl'
      - 'tests/fixtures/**'
      - 'mise.toml'
      - 'mise.lock'
      - 'justfile'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  rust:
    name: rust (build, spec, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust usage just

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: fmt and clippy
        run: just lint

      - name: Build
        run: just build

      - name: The spec snapshot is current
        run: just check-spec

      - name: Tests
        run: just rust-test
