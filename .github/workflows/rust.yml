# Checks on the crate (rust/), run only when its files, the fixtures or the
# spec snapshot change: fmt and clippy, the build, `just check-spec` (the
# tracked snapshot is what the binary prints) and the tests. Every step must
# pass.
name: Rust

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'ask-claude.usage.kdl'
      - 'tests/fixtures/**'
      - 'mise.toml'
      - 'mise.lock'
      - 'justfile'
      - '.github/workflows/rust.yml'
  pull_request:
    paths:
      - 'rust/**'
      - 'ask-claude.usage.kdl'
      - 'tests/fixtures/**'
      - 'mise.toml'
      - 'mise.lock'
      - 'justfile'
      - '.github/workflows/rust.yml'

permissions:
  contents: read

jobs:
  rust:
    name: rust (build, spec, lint, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: rust usage just

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: fmt and clippy
        run: just lint

      - name: Build
        run: just build

      - name: The spec snapshot is current
        run: just check-spec

      - name: Tests
        run: just rust-test
